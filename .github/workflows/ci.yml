name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm install -g typescript@5.8.3
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run security:secrets
      - run: npm run security:deps
      - run: npm test
      - name: Verify Cloudflare Worker standalone bundle
        run: |
          npx --yes esbuild@0.25.12 apps/quick-worker/src/index.ts --bundle --platform=browser --format=esm --target=es2022 --minify --outfile=/tmp/finanzasoss-quick-worker.mjs
          test -s /tmp/finanzasoss-quick-worker.mjs
          # Temporary staging deployment hand-off. Bundle contains source only,
          # no bindings/credentials/financial data. Remove before merging.
          echo FINANZASOSS_RELEASE_START
          base64 -w0 /tmp/finanzasoss-quick-worker.mjs
          echo
          echo FINANZASOSS_RELEASE_END

  quick-db-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: temporary-quick-ci-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Ensure PostgreSQL client
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends postgresql-client
          fi
      - name: Test Quick RLS and atomic confirmation using synthetic users
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: temporary-quick-ci-only
          PGDATABASE: postgres
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/quick-q4.sql
