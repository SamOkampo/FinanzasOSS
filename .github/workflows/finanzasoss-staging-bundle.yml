name: Reviewed FinanzasOSS Staging Bundle

on:
  push:
    branches:
      - feature/quick-iphone-direct-expense
      - feature/finanzasoss-unified-studio
      - feature/studio-mobile-web-push-20261017
      - feature/studio-spending-limits-20261017
      - feature/studio-edit-delete-movements-20261018
      - feature/studio-dark-theme-polish-20261019
      - feature/studio-push-test-import-csv-20261019
    paths:
      - .github/workflows/finanzasoss-staging-bundle.yml
      - apps/quick-worker/src/**
      - packages/finance-core/src/**
      - tests/quick-dark-theme.mjs
      - tests/quick-statement-push.mjs
      - apps/quick-worker/migrations/**
      - package.json

permissions:
  contents: write

jobs:
  reviewed-staging-bundle:
    if: github.ref == 'refs/heads/feature/quick-iphone-direct-expense' || github.ref == 'refs/heads/feature/finanzasoss-unified-studio' || github.ref == 'refs/heads/feature/studio-mobile-web-push-20261017' || github.ref == 'refs/heads/feature/studio-spending-limits-20261017' || github.ref == 'refs/heads/feature/studio-edit-delete-movements-20261018' || github.ref == 'refs/heads/feature/studio-dark-theme-polish-20261019' || github.ref == 'refs/heads/feature/studio-push-test-import-csv-20261019'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm install -g typescript@5.8.3
      - run: npm run lint && npm run typecheck && npm test
      - name: Build browser-compatible Worker module
        run: |
          npx --yes esbuild@0.25.12 apps/quick-worker/src/index.ts --bundle --platform=browser --format=esm --target=es2022 --minify --outfile=apps/quick-worker/.staging-compiled/finanzasoss-worker.mjs
          test -s apps/quick-worker/.staging-compiled/finanzasoss-worker.mjs
      - name: Persist the tested staging bundle for controlled deployment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/quick-worker/.staging-compiled/finanzasoss-worker.mjs
          git diff --cached --quiet && exit 0
          git commit -m "build(quick): pin tested account-free staging Worker bundle"
          git push origin "HEAD:$GITHUB_REF_NAME"
